<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhishLens</title>
  <style>
    :root {
      --bg-dark: #0b0f19;
      --bg-card: rgba(22, 28, 45, 0.75);
      --bg-card-hover: rgba(30, 39, 63, 0.85);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      
      --color-cyan: #38bdf8;
      --color-cyan-glow: rgba(56, 189, 248, 0.25);
      --color-safe: #10b981;
      --color-safe-glow: rgba(16, 185, 129, 0.25);
      --color-danger: #f43f5e;
      --color-danger-glow: rgba(244, 63, 94, 0.25);
      --color-warning: #f59e0b;
      --color-warning-glow: rgba(245, 158, 11, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      width: 380px;
      min-height: 520px;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.08) 0%, transparent 40%);
      color: var(--text-primary);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, #0284c7, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
    }

    .logo-icon svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .brand-title {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.4px;
      background: linear-gradient(135deg, #ffffff 40%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge-version {
      font-size: 10px;
      font-weight: 700;
      color: var(--color-cyan);
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 12px;
      padding: 2px 7px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    /* URL Box */
    .url-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 12px;
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      gap: 5px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }

    .url-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .url-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-secondary);
    }

    .url-text {
      font-size: 12px;
      color: #cbd5e1;
      word-break: break-all;
      line-height: 1.4;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      max-height: 44px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.25);
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Status Block */
    .status-block {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 18px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    /* Status States: Scanning */
    .status-block.scanning {
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 24px var(--color-cyan-glow);
    }

    .status-block.scanning .status-icon-wrapper {
      background: rgba(56, 189, 248, 0.15);
      color: var(--color-cyan);
      box-shadow: 0 0 20px var(--color-cyan-glow);
      animation: pulse-ring 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }

    .status-block.scanning .status-title {
      color: var(--color-cyan);
    }

    /* Status States: Safe */
    .status-block.safe {
      border-color: rgba(16, 185, 129, 0.45);
      box-shadow: 0 0 28px var(--color-safe-glow);
    }

    .status-block.safe .status-icon-wrapper {
      background: rgba(16, 185, 129, 0.18);
      color: var(--color-safe);
      box-shadow: 0 0 20px var(--color-safe-glow);
    }

    .status-block.safe .status-title {
      color: var(--color-safe);
    }

    /* Status States: Phishing */
    .status-block.phishing {
      border-color: rgba(244, 63, 94, 0.55);
      box-shadow: 0 0 32px var(--color-danger-glow);
    }

    .status-block.phishing .status-icon-wrapper {
      background: rgba(244, 63, 94, 0.2);
      color: var(--color-danger);
      box-shadow: 0 0 22px var(--color-danger-glow);
      animation: shake 0.6s cubic-bezier(.36,.07,.19,.97) both;
    }

    .status-block.phishing .status-title {
      color: var(--color-danger);
    }

    /* Status Elements */
    .status-icon-wrapper {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .status-icon-wrapper svg {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .status-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .status-description {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.4;
      max-width: 310px;
    }

    .confidence-meter {
      display: none;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-primary);
      letter-spacing: 0.3px;
    }

    /* SHAP Risk Factors Card */
    .risk-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 14px;
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: fadeIn 0.4s ease;
    }

    .risk-card-header {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .risk-header-icon {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: var(--color-cyan);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .risk-card-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--color-cyan);
    }

    .risk-factors-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .risk-item {
      font-size: 12px;
      color: #e2e8f0;
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 7px 10px;
      line-height: 1.35;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .risk-item-bullet {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-top: 5px;
      flex-shrink: 0;
    }

    .risk-item.phishing-item .risk-item-bullet {
      background: var(--color-danger);
      box-shadow: 0 0 6px var(--color-danger);
    }

    .risk-item.safe-item .risk-item-bullet {
      background: var(--color-safe);
      box-shadow: 0 0 6px var(--color-safe);
    }

    .shap-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10px;
      font-weight: 600;
      color: var(--color-cyan);
      background: rgba(56, 189, 248, 0.12);
      padding: 1px 5px;
      border-radius: 4px;
      white-space: nowrap;
      margin-left: 4px;
    }

    /* Feedback & Actions */
    .actions-card {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-feedback {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      padding: 9px 12px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.2s ease;
    }

    .btn-feedback:hover {
      background: var(--bg-card-hover);
      border-color: rgba(255, 255, 255, 0.18);
      color: var(--text-primary);
      transform: translateY(-1px);
    }

    .btn-feedback svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .feedback-message {
      display: none;
      font-size: 11px;
      text-align: center;
      color: var(--color-cyan);
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 8px;
      padding: 7px;
      animation: fadeIn 0.3s ease;
    }

    /* Footer */
    .footer {
      font-size: 10px;
      color: var(--text-muted);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-safe);
      box-shadow: 0 0 6px var(--color-safe);
    }

    /* Animations */
    @keyframes pulse-ring {
      0% {
        transform: scale(0.96);
        box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.6);
      }
      70% {
        transform: scale(1.04);
        box-shadow: 0 0 0 10px rgba(56, 189, 248, 0);
      }
      100% {
        transform: scale(0.96);
        box-shadow: 0 0 0 0 rgba(56, 189, 248, 0);
      }
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-3px, 0, 0); }
      40%, 60% { transform: translate3d(3px, 0, 0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-3px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="brand-container">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <circle cx="12" cy="11" r="3"/>
        </svg>
      </div>
      <h1 class="brand-title">PhishLens</h1>
    </div>
    <span class="badge-version">AI Protection</span>
  </header>

  <!-- Current Website URL -->
  <section class="url-card">
    <div class="url-header">
      <span class="url-label">Inspected Website</span>
    </div>
    <div id="currentUrl" class="url-text" title="Active Website URL">Detecting tab URL...</div>
  </section>

  <!-- Large Status Block -->
  <main id="statusBlock" class="status-block scanning">
    <div id="statusIcon" class="status-icon-wrapper">
      <!-- Radar / Search Icon (Scanning default) -->
      <svg id="iconSvg" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/>
        <path d="m4.93 4.93 4.24 4.24"/>
        <circle cx="12" cy="12" r="4"/>
      </svg>
    </div>
    <h2 id="statusTitle" class="status-title">Scanning...</h2>
    <p id="statusDescription" class="status-description">
      Connecting to PhishLens AI engine and calculating SHAP explainability...
    </p>
    <div id="confidenceMeter" class="confidence-meter">Confidence: --%</div>
  </main>

  <!-- SHAP Risk Factors Explainability Card -->
  <section id="riskFactorsCard" class="risk-card" style="display: none;">
    <div class="risk-card-header">
      <svg viewBox="0 0 24 24" class="risk-header-icon">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="16" x2="12" y2="12"/>
        <line x1="12" y1="8" x2="12.01" y2="8"/>
      </svg>
      <span id="riskCardTitle" class="risk-card-title">Top Risk Factors (SHAP Explainer)</span>
    </div>
    <ul id="riskFactorsList" class="risk-factors-list">
      <!-- Populated dynamically via popup.js -->
    </ul>
  </section>

  <!-- Feedback / Adaptive Memory -->
  <section class="actions-card">
    <button id="reportMistakeBtn" class="btn-feedback" type="button">
      <svg viewBox="0 0 24 24">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      Report Mistake
    </button>
    <div id="feedbackMessage" class="feedback-message">
      Thank you! Feedback logged to Adaptive Memory.
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <span class="status-dot"></span>
    <span id="backendStatusText">SHAP Explainability Engine Active</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
